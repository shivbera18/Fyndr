<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101218" />
    <title>Offline — Fyndr</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist", Helvetica, Arial, sans-serif;
        background-color: #101218;
        color: #f4f5ef;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: #14161d;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .logo-container {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.5rem auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.25);
      }
      .logo {
        width: 32px;
        height: 32px;
      }
      .offline-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        background: rgba(245, 158, 11, 0.12);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.25);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0.25rem 0.625rem;
        border-radius: 9999px;
        margin-bottom: 1rem;
      }
      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f59e0b;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.02em;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.5;
        color: rgba(244, 245, 239, 0.68);
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.625rem 1.25rem;
        font-size: 0.9375rem;
        font-weight: 600;
        border-radius: 0.75rem;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.15s ease;
        border: none;
        width: 100%;
      }
      .btn-primary {
        background: #10b981;
        color: #0d1117;
      }
      .btn-primary:hover {
        background: #059669;
        transform: translateY(-1px);
      }
      .btn-primary:active {
        transform: translateY(0);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #f4f5ef;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-container">
        <img src="/logo-mark-dark.svg" alt="Fyndr" class="logo" />
      </div>
      <div class="offline-badge">
        <span class="pulse-dot"></span>
        Offline
      </div>
      <h1>You are browsing offline</h1>
      <p>
        Internet connection was interrupted. Photos and event galleries you've already viewed remain cached and accessible.
      </p>
      <div class="actions">
        <button class="btn btn-primary" onclick="window.location.reload()">
          Retry Connection
        </button>
        <a href="/" class="btn btn-secondary">
          Go to Dashboard / Home
        </a>
      </div>
    </div>
  </body>
</html>
