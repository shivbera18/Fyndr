<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #E9EBE2; padding: 40px; }
  .shot { display: inline-block; margin: 0 28px 28px 0; vertical-align: top; }
  .label { font-size: 13px; font-weight: 700; color: #5B5E6A; margin-bottom: 10px; letter-spacing: .06em; text-transform: uppercase; }
  #exp-icon img { width: 512px; height: 512px; display: block; }
  #exp-lockup-light img { width: 992px; display: block; background: #fff; border-radius: 24px; padding: 24px; }
  #exp-lockup-dark img { width: 992px; display: block; }
  #exp-header { background: #fff; border: 1px solid #E4E6DA; border-radius: 14px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; width: 420px; }
  #exp-header img { width: 32px; height: 32px; border-radius: 8px; }
  #exp-header span { font-weight: 800; font-size: 19px; letter-spacing: .14em; color: #14161D; }
  #exp-header i { font-style: normal; color: #65B816; }
  #exp-fav { background: #fff; border-radius: 14px; padding: 20px; display: flex; align-items: flex-end; gap: 20px; }
</style>
</head>
<body>
<div class="shot"><div class="label">Final icon · 512</div><div id="exp-icon"><img src="fyndr-logo-icon.svg"></div></div>
<div class="shot"><div class="label">Final lockup · on light</div><div id="exp-lockup-light"><img src="fyndr-logo-lockup-on-light.svg"></div></div>
<div class="shot"><div class="label">Final lockup · on dark</div><div id="exp-lockup-dark"><img src="fyndr-logo-lockup-on-dark.svg"></div></div>
<div class="shot"><div class="label">Final header · 32px in navbar</div><div id="exp-header"><img src="fyndr-logo-icon.svg"><span>FYNDR<i>.</i></span></div></div>
<div class="shot"><div class="label">Final favicon sizes</div><div id="exp-fav">
<img src="fyndr-logo-icon.svg" width="64" height="64">
<img src="fyndr-logo-icon.svg" width="48" height="48">
<img src="fyndr-logo-icon.svg" width="32" height="32">
<img src="fyndr-logo-icon.svg" width="16" height="16">
</div></div>
<div class="shot"><div class="label">Runner-up · F monogram</div><div id="exp-runnerup"><img src="../v2/fyndr-mark-fshutter.svg" width="512" height="512"></div></div>
</body>
</html>
