<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fyndr logo — aperture find mark">
  <defs>
    <linearGradient id="fy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272B36"/>
      <stop offset="0.55" stop-color="#14161D"/>
      <stop offset="1" stop-color="#090B0F"/>
    </linearGradient>
    <linearGradient id="fy-lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFFFAC"/>
      <stop offset="0.52" stop-color="#B9FF66"/>
      <stop offset="1" stop-color="#8ADB32"/>
    </linearGradient>
    <radialGradient id="fy-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#B9FF66" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B9FF66" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#fy-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#fy-glow)"/>
  <rect x="18" y="18" width="476" height="476" rx="126" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
  <!-- classic shutter pinwheel: outer vertex -> inner point rotated one blade -->
  <g stroke="url(#fy-lime)" stroke-width="34" stroke-linecap="round" fill="none">
    <line x1="256" y1="134" x2="303" y2="229"/>
    <line x1="362" y1="195" x2="303" y2="283"/>
    <line x1="362" y1="317" x2="256" y2="310"/>
    <line x1="256" y1="378" x2="209" y2="283"/>
    <line x1="150" y1="317" x2="209" y2="229"/>
    <line x1="150" y1="195" x2="256" y2="202"/>
  </g>
  <!-- dark hub -->
  <circle cx="256" cy="256" r="58" fill="#0B0D12"/>
  <circle cx="256" cy="256" r="58" fill="none" stroke="#B9FF66" stroke-opacity="0.4" stroke-width="3"/>
  <!-- guest glyph: head + shoulders -->
  <circle cx="256" cy="238" r="16" fill="url(#fy-lime)"/>
  <path d="M224 286 Q256 260 288 286" fill="none" stroke="url(#fy-lime)" stroke-width="17" stroke-linecap="round"/>
</svg>
